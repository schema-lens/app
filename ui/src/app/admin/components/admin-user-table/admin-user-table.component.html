<div class="admin-users__table-container">
  <table mat-table multiTemplateDataRows class="admin-users__table table-objects" [dataSource]="users()">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>{{ ('ADMIN.ID_LABEL' | translate)() }}</th>
      <td mat-cell *matCellDef="let user">{{ user.id }}</td>
    </ng-container>

    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef>{{ ('AUTH.USERNAME_LABEL' | translate)() }}</th>
      <td mat-cell *matCellDef="let user">{{ user.username }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>{{ ('AUTH.EMAIL_LABEL' | translate)() }}</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef>{{ ('ADMIN.USERS.ACTIVE_LABEL' | translate)() }}</th>
      <td mat-cell class="column-icon" *matCellDef="let user"><app-status-icon [status]="user.active" /></td>
    </ng-container>

    <ng-container matColumnDef="admin">
      <th mat-header-cell *matHeaderCellDef>{{ ('ADMIN.USERS.ADMIN_LABEL' | translate)() }}</th>
      <td mat-cell class="column-icon" *matCellDef="let user"><app-status-icon [status]="user.admin" /></td>
    </ng-container>

    <ng-container matColumnDef="expand">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let user">
        <button mat-icon-button [disabled]="saving()" [attr.aria-label]="('ADMIN.USERS.EDIT_LABEL' | translate)() + ': ' + user.username"
          [attr.aria-expanded]="isExpanded(user)" (click)="$event.stopPropagation(); toggleExpansion(user)">
          <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="expandedContent">
      <td mat-cell [attr.colspan]="DISPLAYED_COLUMNS.length" *matCellDef="let user">
        @if (isExpanded(user)) {
          <app-admin-user-editor
            [user]="user"
            [currentUsername]="currentUsername()"
            [saving]="saving()"
            (save)="save.emit({ user, changes: $event })"
            (delete)="delete.emit(user)" />
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="DISPLAYED_COLUMNS"></tr>
    <tr mat-row class="admin-users__row" *matRowDef="let user; columns: DISPLAYED_COLUMNS"
      [class.is-expanded]="isExpanded(user)" (click)="toggleExpansion(user)"></tr>
    <tr mat-row class="admin-users__detail-row" *matRowDef="let user; columns: ['expandedContent']" [class.is-expanded]="isExpanded(user)"></tr>
  </table>
</div>
